<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; media-src 'self'; img-src 'self'; connect-src 'self' https://docs.google.com https://script.google.com https://script.googleusercontent.com https://opensheet.elk.sh https://sheetdb.io https://api.steinhq.com https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#073d3b">
  <title>تمر حنة كافيه - Tamr Henna Café</title>
  <link rel="icon" type="image/webp" href="media/main-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain"></div>
  <i class="botanical b1">❧</i>
  <i class="botanical b2">❦</i>
  <main>
    <header class="hero-header">
      <video class="hero-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="media/hero-background.webm" type="video/webm">
      </video>
      <div class="hero-shade"></div>
    </header>
    <nav class="cat-nav" id="cat-nav" aria-label="أقسام المشروبات"></nav>
    <section class="menu-pages" aria-live="polite">
      <div class="menu-page" id="page-1">
        <div class="page-logo">
          <img src="media/main-logo.webp" alt="Tamr Henna Café">
        </div>
        <div class="slider-viewport" id="slider-viewport">
          <div class="slider-track" id="slider-track"></div>
        </div>
        <div class="slider-controls">
          <button class="nav-arrow prev-btn" id="prev-btn" aria-label="القسم السابق">❮</button>
          <div class="dot-indicators" id="dot-indicators"></div>
          <button class="nav-arrow next-btn" id="next-btn" aria-label="القسم التالي">❯</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js?v=6" defer></script>
</body>
</html>
